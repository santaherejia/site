<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SANTA HEREJIA — Plataforma Privada</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#000;
  color:white;
  text-align:center;
}

header{
  background:#8b0000;
  padding:30px;
}

main{
  max-width:800px;
  margin:auto;
  padding:30px;
}

input, textarea{
  padding:12px;
  border-radius:8px;
  border:none;
  margin-top:10px;
  width:100%;
}

button{
  background:#e10600;
  color:white;
  border:none;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#ff2a2a;
}

.box{
  background:#111;
  padding:20px;
  border-radius:12px;
  margin-top:25px;
}

.hidden{
  display:none;
}
</style>

<script>
function checkPassword(){
  var pass = document.getElementById("password").value;
  if(pass === "SH2026"){
    document.getElementById("login").style.display="none";
    document.getElementById("contenido").style.display="block";
  } else {
    alert("Contraseña incorrecta");
  }
}
</script>

</head>

<body>

<header>
<h1>🔒 Plataforma Privada de Probadoras</h1>
</header>

<main>

<div id="login" class="box">
<h2>Acceso exclusivo</h2>
<p>Ingresá la contraseña que te enviamos por mail.</p>
<input type="password" id="password" placeholder="Contraseña">
<button onclick="checkPassword()">Ingresar</button>
</div>

<div id="contenido" class="hidden">

<h2>Subida de material</h2>

<form action="https://formspree.io/f/meeleryn" method="POST" enctype="multipart/form-data">

<input name="nombre" placeholder="Tu nombre completo" required>

<textarea name="detalle" placeholder="Pack recibido / detalles"></textarea>

<label>Subir fotos (frente, perfil y espalda)</label>
<input type="file" name="fotos" multiple required>

<button type="submit">Enviar material</button>

</form>

</div>

</main>

</body>
</html>
