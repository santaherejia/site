<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SANTA HEREJIA — Plataforma Privada</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#000;
  color:white;
  text-align:center;
}

header{
  background:#8b0000;
  padding:30px;
}

main{
  max-width:800px;
  margin:auto;
  padding:30px;
}

h2{
  color:#e10600;
}

input, textarea{
  padding:12px;
  border-radius:8px;
  border:none;
  margin-top:10px;
  width:100%;
  font-size:15px;
}

textarea{
  min-height:100px;
}

button{
  background:#e10600;
  color:white;
  border:none;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
  width:100%;
}

button:hover{
  background:#ff2a2a;
}

.box{
  background:#111;
  padding:25px;
  border-radius:12px;
  margin-top:25px;
}

.hidden{
  display:none;
}

.info{
  font-size:14px;
  opacity:0.8;
  margin-top:10px;
}
</style>

<script>
function checkPassword(){
  var pass = document.getElementById("password").value;
  if(pass === "SH2026"){
    document.getElementById("login").style.display="none";
    document.getElementById("contenido").style.display="block";
  } else {
    alert("Contraseña incorrecta");
  }
}
</script>

</head>

<body>

<header>
<h1>🔒 Plataforma Privada de Probadoras</h1>
</header>

<main>

<!-- LOGIN -->

<div id="login" class="box">
<h2>Acceso exclusivo</h2>
<p>Ingresá la contraseña que te enviamos por mail.</p>
<input type="password" id="password" placeholder="Contraseña">
<button onclick="checkPassword()">Ingresar</button>
</div>

<!-- CONTENIDO PRIVADO -->

<div id="contenido" class="hidden">

<div class="box">
<h2>Subida de material del pack</h2>
<p>Subí tus fotos a Google Drive o WeTransfer y pegá el link abajo.</p>

<form action="https://formspree.io/f/meeleryn" method="POST">

<input name="nombre" placeholder="Tu nombre completo" required>

<input name="pack" placeholder="Número o nombre del pack recibido" required>

<textarea name="detalle" placeholder="Comentarios sobre el calce, tela, observaciones..."></textarea>

<textarea name="link_fotos" placeholder="Pegá acá el link de Drive o WeTransfer con las fotos (frente, perfil y espalda)" required></textarea>

<button type="submit">Enviar material</button>

</form>

<p class="info">
⚠️ Asegurate de que el link esté configurado como “Cualquiera con el enlace puede ver”.
</p>

</div>

</div>

</main>

</body>
</html>
